<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trystero 接続テスト</title>
<style>
:root{--bg:#f4f6fa;--fg:#222;--card:#fff;--ac:#1e88e5;--ok:#2e7d32;--ng:#c62828;--mu:#777;--bd:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#eee;--card:#23262e;--mu:#9aa;--bd:#3a3e48;--ok:#66bb6a;--ng:#ef5350}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;font-size:1rem;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);margin:4px 0 8px}
button{font-size:1rem;font-weight:700;border:0;border-radius:10px;padding:12px;width:100%;background:var(--ac);color:#fff;margin-top:6px}
button:disabled{opacity:.45}
.mu{color:var(--mu);font-size:.85rem}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.95rem}
.row:last-child{border:0}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}
#log{font:12px/1.5 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.hide{display:none}
</style></head><body><main>
<h1>🔌 Trystero 接続テスト</h1>

<div class="card" id="sJoin">
  <div class="mu">2台以上の端末(PCとスマホなど)で同じ合言葉を入れて「接続」を押してください。</div>
  <input id="code" maxlength="8" placeholder="合言葉(例: 1234)" value="1234">
  <button id="bJoin">接続</button>
</div>

<div class="card hide" id="sRun">
  <div class="row"><span>あなたのID</span><span id="me" class="mu"></span></div>
  <div class="row"><span>ライブラリ読み込み</span><span id="stLib" class="ok">OK</span></div>
  <div class="row"><span>相手との接続</span><span id="stPeer" class="mu">相手を探しています…</span></div>
  <div class="row"><span>経過時間</span><span id="el">0秒</span></div>
  <div id="hint" class="mu hide" style="margin-top:8px"></div>
</div>

<div class="card hide" id="sPeers">
  <b>接続中の相手</b>
  <div id="plist" style="margin:8px 0"></div>
  <button id="bPing">Pingを送る(往復時間を測る)</button>
</div>

<div class="card"><b>ログ</b><div id="log" class="mu"></div></div>
</main>
<script type="module">
const $=id=>document.getElementById(id);
const APP_ID="pokemon-quiz-test-hs7k2"; // 本番とは別の文字列にしておく
const logEl=$("log");
const log=m=>{const t=new Date().toTimeString().slice(0,8);logEl.textContent+=`[${t}] ${m}\n`;logEl.scrollTop=logEl.scrollHeight};

let T;
try{ T=await import("https://cdn.jsdelivr.net/npm/trystero@0.21/+esm"); log("ライブラリ読み込み成功") }
catch(e){ $("sRun").classList.remove("hide");$("stLib").textContent="失敗";$("stLib").className="ng";log("ライブラリ読み込み失敗: "+e.message) }

const peers=new Map(); // id -> {rtt, type}
let room,sendPing,sendPong,t0;

function render(){
  const l=$("plist");l.textContent="";
  peers.forEach((v,id)=>{
    const r=document.createElement("div");r.className="row";
    const a=document.createElement("span");a.textContent=id.slice(0,6)+"…  "+(v.type||"");
    const b=document.createElement("b");b.textContent=v.rtt!=null?v.rtt+" ms":"—";
    r.append(a,b);l.append(r);
  });
  const n=peers.size;
  $("stPeer").textContent=n?`${n}人と接続中 ✅`:"相手を探しています…";
  $("stPeer").className=n?"ok":"mu";
  $("sPeers").classList.toggle("hide",!n);
  if(n)$("hint").classList.add("hide");
}

async function connType(id){
  try{
    const pc=room.getPeers()[id]; if(!pc||!pc.getStats)return;
    const st=await pc.getStats();let local=null,cand={};
    st.forEach(r=>{ if(r.type==="local-candidate")cand[r.id]=r.candidateType;
      if(r.type==="candidate-pair"&&r.state==="succeeded"&&(r.nominated||r.selected))local=r.localCandidateId });
    const t=cand[local];
    if(t){peers.get(id).type=t==="relay"?"(中継 TURN)":"(直接 "+t+")";render();log(`${id.slice(0,6)} 接続経路: ${t}`)}
  }catch(e){}
}

$("bJoin").onclick=()=>{
  if(!T)return;
  const code=$("code").value.trim();if(!code)return;
  $("sJoin").classList.add("hide");$("sRun").classList.remove("hide");
  $("me").textContent=T.selfId.slice(0,8)+"…";
  try{ room=T.joinRoom({appId:APP_ID},"test-"+code) }
  catch(e){log("joinRoom 失敗: "+e.message);return}
  log("部屋に参加: test-"+code+"(相手を探しています)");
  t0=Date.now();
  let getPing,getPong;
  [sendPing,getPing]=room.makeAction("ping");
  [sendPong,getPong]=room.makeAction("pong");
  getPing((d,id)=>{sendPong(d,id);log(`Ping受信 ← ${id.slice(0,6)}`)});
  getPong((d,id)=>{const p=peers.get(id);if(p){p.rtt=Date.now()-d.t;render();log(`Pong ${id.slice(0,6)}: ${p.rtt}ms`)}});
  room.onPeerJoin(id=>{peers.set(id,{rtt:null,type:""});render();log("相手が参加: "+id.slice(0,6));setTimeout(()=>connType(id),2500)});
  room.onPeerLeave(id=>{peers.delete(id);render();log("相手が退出: "+id.slice(0,6))});
  setInterval(()=>{
    const s=Math.floor((Date.now()-t0)/1000);$("el").textContent=s+"秒";
    if(s>=20&&!peers.size){const h=$("hint");h.classList.remove("hide");
      h.textContent="20秒たっても相手が見つかりません。相手も同じ合言葉で接続済みか、別のネットワーク(スマホ回線など)でも試してみてください。"}
  },1000);
};
$("bPing").onclick=()=>{
  if(!peers.size)return;
  sendPing({t:Date.now()});log("Pingを送信");
};
</script></body></html>
