<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンクイズ</title>
    <link rel="stylesheet" href="https://assets.myu-jp.f5.si/css/base.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header><div class="ball"></div>ポケモンクイズ</header>
    <main></main>
    <script type="module">
        import {joinRoom} from "../assets/js/net.js";

        const APP_ID="myu-pokemon-quiz";
        const q=new URLSearchParams(window.location.search);
        const roomId=q.get("id");
        $=(selector)=>document.querySelector(selector);
        const logEl=$("main");
        const log=m=>{const t=new Date().toTimeString().slice(0,8);logEl.textContent+=`[${t}] ${m}\n`;logEl.scrollTop=logEl.scrollHeight};

        async function  init() {
            let net;
            try{
                net=await joinRoom({APP_ID,roomId,log});
            }catch(e){
                log(e);
            }
        }
        init();
    </script>
</body>
</html>
